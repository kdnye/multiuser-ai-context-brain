# Builds the server image from a reviewed commit. Repository-connected triggers supply COMMIT_SHA; for an attended
# local submission override _REVISION with the exact checked-out commit (deploy/README.md). _REPO is your Artifact
# Registry Docker repository name.
substitutions:
  _REVISION: '${COMMIT_SHA}'
  _REPO: 'context-brain'
  _REGION: 'us-central1'
options:
  dynamicSubstitutions: true
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --label
      - 'org.opencontainers.image.revision=${_REVISION}'
      - -t
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/server:${_REVISION}'
      - .
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/server:${_REVISION}'
